name: topic22-airflow

x-airflow: &airflow
  image: topic22-airflow:local
  pull_policy: never
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/logs/simple-auth-passwords.json
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in the repo .env file}"
    AIRFLOW__API__SECRET_KEY: "${AIRFLOW_JWT_SECRET}"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    RECSYS_AIRFLOW_CRON: "${RECSYS_AIRFLOW_CRON:-0 9 * * *}"
    RECSYS_ALERT_WEBHOOK_URL: "${RECSYS_ALERT_WEBHOOK_URL:-}"
    OMP_NUM_THREADS: "2"
    PANDAS_COPY_ON_WRITE: "1"
    MALLOC_ARENA_MAX: "2"
  volumes:
    - ../pipeline_data:/opt/recsys/pipeline_data
    - ../pipeline_runs:/opt/recsys/pipeline_runs
    - airflow-logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  airflow-init:
    <<: *airflow
    build:
      context: ..
      dockerfile: orchestration/Dockerfile
    command: ["db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  airflow-api:
    <<: *airflow
    command: ["api-server"]
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v2/monitor/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    depends_on:
      airflow-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8974/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  airflow-logs:
